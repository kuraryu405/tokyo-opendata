name: Deploy one Worker

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      app_directory:
        required: true
        type: string
      revision:
        required: true
        type: string
      staging_worker:
        required: true
        type: string
      production_worker:
        required: true
        type: string
      staging_environment:
        required: true
        type: string
      production_environment:
        required: true
        type: string
      staging_database_id:
        required: true
        type: string
      production_database_id:
        required: true
        type: string
      staging_verification_url:
        required: true
        type: string
      production_verification_url:
        required: true
        type: string
      staging_counterpart_url:
        required: true
        type: string
      production_counterpart_url:
        required: true
        type: string
    outputs:
      production_url:
        description: Production URL that passed the release health check
        value: ${{ jobs.production.outputs.production_url }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: worker-release-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      staging_worker: ${{ steps.resolve.outputs.staging_worker }}
      production_worker: ${{ steps.resolve.outputs.production_worker }}
      staging_verification_url: ${{ steps.resolve.outputs.staging_verification_url }}
      production_verification_url: ${{ steps.resolve.outputs.production_verification_url }}
      staging_counterpart_url: ${{ steps.resolve.outputs.staging_counterpart_url }}
      production_counterpart_url: ${{ steps.resolve.outputs.production_counterpart_url }}
    steps:
      - id: resolve
        name: Resolve and validate release configuration
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
          APP_DIRECTORY: ${{ inputs.app_directory }}
          REVISION: ${{ inputs.revision }}
          STAGING_WORKER_INPUT: ${{ inputs.staging_worker }}
          PRODUCTION_WORKER_INPUT: ${{ inputs.production_worker }}
          STAGING_ENVIRONMENT: ${{ inputs.staging_environment }}
          PRODUCTION_ENVIRONMENT: ${{ inputs.production_environment }}
          STAGING_DATABASE_ID: ${{ inputs.staging_database_id }}
          PRODUCTION_DATABASE_ID: ${{ inputs.production_database_id }}
          STAGING_VERIFICATION_URL: ${{ inputs.staging_verification_url }}
          PRODUCTION_VERIFICATION_URL: ${{ inputs.production_verification_url }}
          STAGING_COUNTERPART_URL: ${{ inputs.staging_counterpart_url }}
          PRODUCTION_COUNTERPART_URL: ${{ inputs.production_counterpart_url }}
        run: |
          set -euo pipefail
          case "$SERVICE:$APP_DIRECTORY" in
            user:apps/user|municipality:apps/municipality) ;;
            *) echo "Unsupported service or app directory." >&2; exit 1 ;;
          esac
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Revision must be a full commit SHA." >&2
            exit 1
          }

          staging_worker="$STAGING_WORKER_INPUT"
          production_worker="$PRODUCTION_WORKER_INPUT"
          for worker in "$staging_worker" "$production_worker"; do
            [[ "$worker" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ ]] || {
              echo "Invalid Worker name: $worker" >&2
              exit 1
            }
          done

          [ "$STAGING_ENVIRONMENT" = "staging" ] && [ "$PRODUCTION_ENVIRONMENT" = "production" ] || {
            echo "Release environments must be staging and production." >&2
            exit 1
          }
          d1_id_pattern='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "$STAGING_DATABASE_ID" =~ $d1_id_pattern ]] && [[ "$PRODUCTION_DATABASE_ID" =~ $d1_id_pattern ]] || {
            echo "Environment-specific D1 database IDs must be configured." >&2
            exit 1
          }
          staging_database_id="${STAGING_DATABASE_ID,,}"
          production_database_id="${PRODUCTION_DATABASE_ID,,}"
          [ "$staging_database_id" != "$production_database_id" ] || {
            echo "Staging and production must not use the same D1 database." >&2
            exit 1
          }
          for placeholder in \
            00000000-0000-4000-8000-000000000001 \
            00000000-0000-4000-8000-000000000002 \
            00000000-0000-4000-8000-000000000003; do
            [ "$staging_database_id" != "$placeholder" ] && [ "$production_database_id" != "$placeholder" ] || {
              echo "Placeholder D1 database IDs cannot be deployed." >&2
              exit 1
            }
          done
          [[ "$STAGING_VERIFICATION_URL" == https://* && "$PRODUCTION_VERIFICATION_URL" == https://* && \
            "$STAGING_COUNTERPART_URL" == https://* && "$PRODUCTION_COUNTERPART_URL" == https://* ]] || {
            echo "Site and counterpart URLs must use HTTPS." >&2
            exit 1
          }
          staging_verification_url="${STAGING_VERIFICATION_URL%/}"
          production_verification_url="${PRODUCTION_VERIFICATION_URL%/}"
          staging_counterpart_url="${STAGING_COUNTERPART_URL%/}"
          production_counterpart_url="${PRODUCTION_COUNTERPART_URL%/}"
          [ "$staging_verification_url" != "$production_verification_url" ] && \
            [ "$staging_counterpart_url" != "$production_counterpart_url" ] || {
            echo "Staging and production URLs must be environment-specific." >&2
            exit 1
          }

          {
            echo "staging_worker=$staging_worker"
            echo "production_worker=$production_worker"
            echo "staging_verification_url=$staging_verification_url"
            echo "production_verification_url=$production_verification_url"
            echo "staging_counterpart_url=$staging_counterpart_url"
            echo "production_counterpart_url=$production_counterpart_url"
          } >> "$GITHUB_OUTPUT"

  d1_identity:
    needs: configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify authenticated D1 database identities
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DATABASE_ID: ${{ inputs.staging_database_id }}
          PRODUCTION_DATABASE_ID: ${{ inputs.production_database_id }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "Cloudflare deployment secrets are not configured." >&2
            exit 1
          }
          pnpm dlx wrangler@4.92.0 d1 list --json > d1-inventory.json
          node scripts/cd/validate-d1-inventory.mjs \
            d1-inventory.json "$STAGING_DATABASE_ID" "$PRODUCTION_DATABASE_ID"

  build:
    needs: [configuration, d1_identity]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_DIRECTORY: ${{ inputs.app_directory }}
      APP_REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build deployable output once
        run: pnpm --filter "@staybridge/${{ inputs.service }}" run build
      - name: Validate and package the SHA artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cd/validate-dist.mjs "$APP_DIRECTORY"
          artifact_name="staybridge-${{ inputs.service }}-${{ inputs.revision }}"
          artifact_file="${artifact_name}.tar.gz"
          tar -czf "$artifact_file" -C "$APP_DIRECTORY" dist
          sha256sum "$artifact_file" > "${artifact_file}.sha256"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.artifact_name }}.tar.gz
            ${{ steps.package.outputs.artifact_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  staging:
    needs: [configuration, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.staging_environment }}
      url: ${{ needs.configuration.outputs.staging_verification_url }}
    env:
      SERVICE: ${{ inputs.service }}
      REVISION: ${{ inputs.revision }}
      WORKER_NAME: ${{ needs.configuration.outputs.staging_worker }}
      SITE_URL: ${{ needs.configuration.outputs.staging_verification_url }}
      COUNTERPART_URL: ${{ needs.configuration.outputs.staging_counterpart_url }}
      ARTIFACT_NAME: staybridge-${{ inputs.service }}-${{ inputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-artifact
      - name: Verify and extract the exact build artifact
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifact
          sha256sum --check "${ARTIFACT_NAME}.tar.gz.sha256"
          mkdir dist-package
          tar -xzf "${ARTIFACT_NAME}.tar.gz" -C dist-package
      - name: Configure the staging D1 binding
        env:
          D1_DATABASE_ID: ${{ inputs.staging_database_id }}
        run: >-
          node scripts/cd/configure-d1.mjs
          "$PWD/release-artifact/dist-package/dist/server/wrangler.json"
          staging "$D1_DATABASE_ID"
      - name: Configure the staging AI binding
        run: >-
          node scripts/cd/configure-ai-binding.mjs
          "$PWD/release-artifact/dist-package/dist/server/wrangler.json"
          "$SERVICE"
      - name: Configure the staging rate limit namespaces
        run: >-
          node scripts/cd/configure-rate-limits.mjs
          "$PWD/release-artifact/dist-package/dist/server/wrangler.json"
          "$SERVICE" staging
      - name: Upload and deploy the staging Worker Version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "Cloudflare deployment secrets are not configured." >&2
            exit 1
          }
          config="$PWD/release-artifact/dist-package/dist/server/wrangler.json"
          pnpm dlx wrangler@4.92.0 versions upload \
            --config "$config" \
            --name "$WORKER_NAME" \
            --tag "$REVISION" \
            --message "${SERVICE} staging ${REVISION}" \
            --var "APP_REVISION:${REVISION}" \
            --var "COUNTERPART_APP_URL:${COUNTERPART_URL}"
          pnpm dlx wrangler@4.92.0 versions list \
            --config "$config" --name "$WORKER_NAME" --json > staging-versions.json
          version_id=$(node scripts/cd/wrangler-state.mjs uploaded staging-versions.json "$REVISION")
          pnpm dlx wrangler@4.92.0 versions deploy "${version_id}@100%" \
            --config "$config" \
            --name "$WORKER_NAME" \
            --message "${SERVICE} staging ${REVISION}" \
            --yes
          pnpm dlx wrangler@4.92.0 triggers deploy \
            --config "$config" --name "$WORKER_NAME"
      - name: Smoke test staging
        run: node scripts/cd/smoke-health.mjs "$SITE_URL" "$SERVICE" "$REVISION"

  production:
    needs: [configuration, build, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.production_environment }}
      url: ${{ needs.configuration.outputs.production_verification_url }}
    outputs:
      production_url: ${{ steps.release_result.outputs.production_url }}
    env:
      SERVICE: ${{ inputs.service }}
      REVISION: ${{ inputs.revision }}
      WORKER_NAME: ${{ needs.configuration.outputs.production_worker }}
      SITE_URL: ${{ needs.configuration.outputs.production_verification_url }}
      COUNTERPART_URL: ${{ needs.configuration.outputs.production_counterpart_url }}
      ARTIFACT_NAME: staybridge-${{ inputs.service }}-${{ inputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-artifact
      - name: Verify and extract the exact build artifact
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifact
          sha256sum --check "${ARTIFACT_NAME}.tar.gz.sha256"
          mkdir dist-package
          tar -xzf "${ARTIFACT_NAME}.tar.gz" -C dist-package
      - name: Configure the production D1 binding
        env:
          D1_DATABASE_ID: ${{ inputs.production_database_id }}
        run: >-
          node scripts/cd/configure-d1.mjs
          "$PWD/release-artifact/dist-package/dist/server/wrangler.json"
          production "$D1_DATABASE_ID"
      - name: Configure the production AI binding
        run: >-
          node scripts/cd/configure-ai-binding.mjs
          "$PWD/release-artifact/dist-package/dist/server/wrangler.json"
          "$SERVICE"
      - name: Configure the production rate limit namespaces
        run: >-
          node scripts/cd/configure-rate-limits.mjs
          "$PWD/release-artifact/dist-package/dist/server/wrangler.json"
          "$SERVICE" production
      - name: Capture the previous production version
        id: previous
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "Cloudflare deployment secrets are not configured." >&2
            exit 1
          }
          config="$PWD/release-artifact/dist-package/dist/server/wrangler.json"
          previous=""
          if pnpm dlx wrangler@4.92.0 deployments status \
            --config "$config" --name "$WORKER_NAME" --json > previous-deployment.json 2>/dev/null; then
            previous=$(node scripts/cd/wrangler-state.mjs current previous-deployment.json)
          fi
          echo "version_id=$previous" >> "$GITHUB_OUTPUT"
      - name: Upload and deploy the production Worker Version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          config="$PWD/release-artifact/dist-package/dist/server/wrangler.json"
          pnpm dlx wrangler@4.92.0 versions upload \
            --config "$config" \
            --name "$WORKER_NAME" \
            --tag "$REVISION" \
            --message "${SERVICE} production ${REVISION}" \
            --var "APP_REVISION:${REVISION}" \
            --var "COUNTERPART_APP_URL:${COUNTERPART_URL}"
          pnpm dlx wrangler@4.92.0 versions list \
            --config "$config" --name "$WORKER_NAME" --json > production-versions.json
          version_id=$(node scripts/cd/wrangler-state.mjs uploaded production-versions.json "$REVISION")
          pnpm dlx wrangler@4.92.0 versions deploy "${version_id}@100%" \
            --config "$config" \
            --name "$WORKER_NAME" \
            --message "${SERVICE} production ${REVISION}" \
            --yes
          pnpm dlx wrangler@4.92.0 triggers deploy \
            --config "$config" --name "$WORKER_NAME"
      - name: Smoke test production
        id: production_smoke
        continue-on-error: true
        run: node scripts/cd/smoke-health.mjs "$SITE_URL" "$SERVICE" "$REVISION"
      - name: Roll back a failed production health check
        if: ${{ always() && steps.production_smoke.outcome == 'failure' && steps.previous.outputs.version_id != '' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version_id }}
        run: |
          set -euo pipefail
          config="$PWD/release-artifact/dist-package/dist/server/wrangler.json"
          pnpm dlx wrangler@4.92.0 rollback "$PREVIOUS_VERSION" \
            --config "$config" \
            --name "$WORKER_NAME" \
            --message "Automatic rollback after failed health check for ${REVISION}" \
            --yes
          pnpm dlx wrangler@4.92.0 deployments status \
            --config "$config" --name "$WORKER_NAME" --json > rollback-deployment.json
          node scripts/cd/wrangler-state.mjs assert-active \
            rollback-deployment.json "$PREVIOUS_VERSION"
      - name: Fail after production smoke and rollback handling
        if: ${{ always() && steps.production_smoke.outcome == 'failure' }}
        run: |
          echo "Production health failed. Rollback was attempted when a previous version existed." >&2
          exit 1
      - id: release_result
        name: Record the healthy production URL
        run: echo "production_url=$SITE_URL" >> "$GITHUB_OUTPUT"
