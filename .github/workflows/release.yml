name: Release Workers

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  detect:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      user: ${{ steps.scopes.outputs.user }}
      municipality: ${{ steps.scopes.outputs.municipality }}
      user_staging_worker: ${{ steps.config.outputs.user_staging_worker }}
      user_production_worker: ${{ steps.config.outputs.user_production_worker }}
      municipality_staging_worker: ${{ steps.config.outputs.municipality_staging_worker }}
      municipality_production_worker: ${{ steps.config.outputs.municipality_production_worker }}
      user_staging_url: ${{ steps.config.outputs.user_staging_url }}
      user_production_url: ${{ steps.config.outputs.user_production_url }}
      municipality_staging_url: ${{ steps.config.outputs.municipality_staging_url }}
      municipality_production_url: ${{ steps.config.outputs.municipality_production_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-range-${{ github.event.workflow_run.head_sha }}
          path: release-metadata
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - id: revision
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - id: scopes
        name: Detect affected applications
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          base=$(node -p "JSON.parse(require('fs').readFileSync('release-metadata/release-range.json', 'utf8')).base")
          head=$(node -p "JSON.parse(require('fs').readFileSync('release-metadata/release-range.json', 'utf8')).head")
          [ "$head" = "$RELEASE_SHA" ] || {
            echo "CI release range does not match the successful workflow SHA." >&2
            exit 1
          }
          if [[ "$base" =~ ^0+$ ]]; then base=""; fi
          node scripts/cd/detect-scopes.mjs "$base" "$RELEASE_SHA"
      - id: config
        name: Resolve release names and URLs
        shell: bash
        env:
          USER_STAGING_WORKER: ${{ vars.USER_STAGING_WORKER }}
          USER_PRODUCTION_WORKER: ${{ vars.USER_PRODUCTION_WORKER }}
          MUNICIPALITY_STAGING_WORKER: ${{ vars.MUNICIPALITY_STAGING_WORKER }}
          MUNICIPALITY_PRODUCTION_WORKER: ${{ vars.MUNICIPALITY_PRODUCTION_WORKER }}
          USER_STAGING_URL: ${{ vars.USER_STAGING_URL }}
          USER_PRODUCTION_URL: ${{ vars.USER_PRODUCTION_URL }}
          MUNICIPALITY_STAGING_URL: ${{ vars.MUNICIPALITY_STAGING_URL }}
          MUNICIPALITY_PRODUCTION_URL: ${{ vars.MUNICIPALITY_PRODUCTION_URL }}
          WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          user_staging_worker=${USER_STAGING_WORKER:-staybridge-user-staging}
          user_production_worker=${USER_PRODUCTION_WORKER:-staybridge-user-production}
          municipality_staging_worker=${MUNICIPALITY_STAGING_WORKER:-staybridge-municipality-staging}
          municipality_production_worker=${MUNICIPALITY_PRODUCTION_WORKER:-staybridge-municipality-production}

          resolve_url() {
            local explicit="$1"
            local worker="$2"
            if [ -n "$explicit" ]; then
              printf '%s' "${explicit%/}"
            elif [ -n "$WORKERS_SUBDOMAIN" ]; then
              printf 'https://%s.%s.workers.dev' "$worker" "$WORKERS_SUBDOMAIN"
            else
              echo "Configure release URLs or CLOUDFLARE_WORKERS_SUBDOMAIN." >&2
              return 1
            fi
          }

          {
            echo "user_staging_worker=$user_staging_worker"
            echo "user_production_worker=$user_production_worker"
            echo "municipality_staging_worker=$municipality_staging_worker"
            echo "municipality_production_worker=$municipality_production_worker"
            echo "user_staging_url=$(resolve_url "$USER_STAGING_URL" "$user_staging_worker")"
            echo "user_production_url=$(resolve_url "$USER_PRODUCTION_URL" "$user_production_worker")"
            echo "municipality_staging_url=$(resolve_url "$MUNICIPALITY_STAGING_URL" "$municipality_staging_worker")"
            echo "municipality_production_url=$(resolve_url "$MUNICIPALITY_PRODUCTION_URL" "$municipality_production_worker")"
          } >> "$GITHUB_OUTPUT"

  deploy-user:
    needs: detect
    if: ${{ needs.detect.outputs.user == 'true' }}
    uses: ./.github/workflows/deploy-worker.yml
    with:
      service: user
      app_directory: apps/user
      revision: ${{ needs.detect.outputs.revision }}
      staging_worker: ${{ needs.detect.outputs.user_staging_worker }}
      production_worker: ${{ needs.detect.outputs.user_production_worker }}
      staging_url: ${{ needs.detect.outputs.user_staging_url }}
      production_url: ${{ needs.detect.outputs.user_production_url }}
      counterpart_url: ${{ needs.detect.outputs.municipality_production_url }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-municipality:
    needs: detect
    if: ${{ needs.detect.outputs.municipality == 'true' }}
    uses: ./.github/workflows/deploy-worker.yml
    with:
      service: municipality
      app_directory: apps/municipality
      revision: ${{ needs.detect.outputs.revision }}
      staging_worker: ${{ needs.detect.outputs.municipality_staging_worker }}
      production_worker: ${{ needs.detect.outputs.municipality_production_worker }}
      staging_url: ${{ needs.detect.outputs.municipality_staging_url }}
      production_url: ${{ needs.detect.outputs.municipality_production_url }}
      counterpart_url: ${{ needs.detect.outputs.user_production_url }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  external-e2e:
    needs: [detect, deploy-user, deploy-municipality]
    if: >-
      always() &&
      needs.detect.result == 'success' &&
      (needs.detect.outputs.user == 'true' || needs.detect.outputs.municipality == 'true') &&
      (needs.deploy-user.result == 'success' || needs.deploy-user.result == 'skipped') &&
      (needs.deploy-municipality.result == 'success' || needs.deploy-municipality.result == 'skipped')
    uses: kuraryu405/StayBridgeTokyo-e2e/.github/workflows/acceptance.yml@main
    with:
      target_commit: ${{ needs.detect.outputs.revision }}
      user_url: ${{ needs.detect.outputs.user_production_url }}
      municipality_url: ${{ needs.detect.outputs.municipality_production_url }}
      evidence_mode: false
