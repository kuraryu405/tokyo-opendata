name: Repair staging D1 schema

on:
  push:
    branches:
      - chore/staging-d1-schema-20260901

permissions:
  contents: read

concurrency:
  group: repair-staging-d1-schema
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'kuraryu405/tokyo-opendata'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply and verify staging-only D1 migrations
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DATABASE_ID: ${{ vars.STAYBRIDGE_STAGING_D1_DATABASE_ID }}
          PRODUCTION_DATABASE_ID: ${{ vars.STAYBRIDGE_PRODUCTION_D1_DATABASE_ID }}
          WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "Cloudflare deployment secrets are not configured." >&2
            exit 1
          }
          [[ "$STAGING_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "The staging D1 database ID is invalid." >&2
            exit 1
          }
          [[ "$PRODUCTION_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "The production D1 database ID is invalid." >&2
            exit 1
          }
          [ "${STAGING_DATABASE_ID,,}" != "${PRODUCTION_DATABASE_ID,,}" ] || {
            echo "Staging and production D1 IDs must differ." >&2
            exit 1
          }
          [[ "$WORKERS_SUBDOMAIN" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ ]] || {
            echo "CLOUDFLARE_WORKERS_SUBDOMAIN is invalid." >&2
            exit 1
          }
          echo "::add-mask::$STAGING_DATABASE_ID"
          echo "::add-mask::$PRODUCTION_DATABASE_ID"

          pnpm exec wrangler d1 list --json > d1-inventory.json
          node scripts/cd/validate-d1-inventory.mjs \
            d1-inventory.json "$STAGING_DATABASE_ID" "$PRODUCTION_DATABASE_ID"
          echo "Authenticated D1 identity verification passed."
          node scripts/d1/prepare-remote-config.mjs \
            staging "$STAGING_DATABASE_ID" >/dev/null
          d1_config=.wrangler/d1/staging.json

          pnpm exec wrangler d1 migrations list STAYBRIDGE_DB \
            --remote --config "$d1_config"
          pnpm exec wrangler d1 migrations apply STAYBRIDGE_DB \
            --remote --config "$d1_config"
          echo "Staging D1 migration apply completed."

          schema_markers="$(pnpm exec wrangler d1 execute STAYBRIDGE_DB \
            --remote --config "$d1_config" \
            --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('open_data_sources') WHERE name = 'landing_page_url') + (SELECT COUNT(*) FROM pragma_table_info('open_data_dataset_versions') WHERE name = 'source_id') + (SELECT COUNT(*) FROM pragma_table_info('open_data_resources') WHERE name = 'description') + (SELECT COUNT(*) FROM pragma_table_info('open_data_active_datasets') WHERE name = 'source_id') + (SELECT COUNT(*) FROM pragma_table_info('open_data_import_runs') WHERE name = 'http_status') AS legacy_markers, (SELECT COUNT(*) FROM pragma_table_info('open_data_sources') WHERE name IN ('data_updated_at', 'fetched_at')) + (SELECT COUNT(*) FROM pragma_table_info('open_data_dataset_versions') WHERE name = 'dataset_key') + (SELECT COUNT(*) FROM pragma_table_info('open_data_resources') WHERE name IN ('source_id', 'data_updated_at')) + (SELECT COUNT(*) FROM pragma_table_info('open_data_active_datasets') WHERE name = 'dataset_key') + (SELECT COUNT(*) FROM pragma_table_info('open_data_import_runs') WHERE name = 'dataset_key') AS current_markers" \
            --json)"
          legacy_markers="$(jq -r '.[0].results[0].legacy_markers' \
            <<<"$schema_markers")"
          current_markers="$(jq -r '.[0].results[0].current_markers' \
            <<<"$schema_markers")"
          if [ "$current_markers" = "7" ] && [ "$legacy_markers" = "0" ]; then
            echo "The staging Open Data schema is already current."
          else
            [ "$legacy_markers" = "5" ] && [ "$current_markers" = "0" ] || {
              echo "The staging Open Data schema is neither the reviewed legacy shape nor the current shape." >&2
              exit 1
            }
            legacy_table_count="$(pnpm exec wrangler d1 execute STAYBRIDGE_DB \
              --remote --config "$d1_config" \
              --command "SELECT COUNT(*) AS count FROM sqlite_master WHERE type = 'table' AND name LIKE 'legacy_open_data_%_20260823'" \
              --json)"
            jq -e '.[0].success == true and .[0].results[0].count == 0' \
              <<<"$legacy_table_count" >/dev/null
            before_counts="$(pnpm exec wrangler d1 execute STAYBRIDGE_DB \
              --remote --config "$d1_config" \
              --command "SELECT (SELECT COUNT(*) FROM open_data_sources) AS sources, (SELECT COUNT(*) FROM open_data_dataset_versions) AS versions, (SELECT COUNT(*) FROM open_data_resources) AS resources, (SELECT COUNT(*) FROM open_data_active_datasets) AS active_datasets, (SELECT COUNT(*) FROM open_data_import_runs) AS import_runs" \
              --json)"

            repair_file="$RUNNER_TEMP/repair-staging-open-data-schema.sql"
            cp scripts/d1/repair-staging-open-data-schema.sql "$repair_file"
            printf '\n' >> "$repair_file"
            sed -n '1,$p' database/migrations/0003_open_data_cache.sql >> "$repair_file"
            pnpm exec wrangler d1 execute STAYBRIDGE_DB \
              --remote --config "$d1_config" \
              --file "$repair_file" --yes

            after_counts="$(pnpm exec wrangler d1 execute STAYBRIDGE_DB \
              --remote --config "$d1_config" \
              --command "SELECT (SELECT COUNT(*) FROM legacy_open_data_sources_20260823) AS sources, (SELECT COUNT(*) FROM legacy_open_data_dataset_versions_20260823) AS versions, (SELECT COUNT(*) FROM legacy_open_data_resources_20260823) AS resources, (SELECT COUNT(*) FROM legacy_open_data_active_datasets_20260823) AS active_datasets, (SELECT COUNT(*) FROM legacy_open_data_import_runs_20260823) AS import_runs" \
              --json)"
            [ "$(jq -c '.[0].results[0]' <<<"$before_counts")" = \
              "$(jq -c '.[0].results[0]' <<<"$after_counts")" ] || {
              echo "Legacy Open Data row-count preservation failed." >&2
              exit 1
            }
            echo "The legacy Open Data tables were preserved and the current schema was created."
          fi

          pnpm exec wrangler d1 execute STAYBRIDGE_DB \
            --remote --config "$d1_config" \
            --file database/seed.sql --yes
          echo "Staging D1 seed apply completed."
          migration_state="$(pnpm exec wrangler d1 migrations list STAYBRIDGE_DB \
            --remote --config "$d1_config" 2>&1)"
          grep -q 'No migrations to apply' <<<"$migration_state"

          schema_state="$(pnpm exec wrangler d1 execute STAYBRIDGE_DB \
            --remote --config "$d1_config" \
            --command "SELECT COUNT(*) AS count FROM sqlite_master WHERE type = 'table' AND name IN ('backend_metadata', 'situation_submissions', 'situation_submission_capabilities', 'conversations', 'conversation_messages', 'open_data_sources', 'open_data_dataset_versions', 'open_data_resources', 'open_data_active_datasets', 'open_data_import_runs')" \
            --json)"
          jq -e '.[0].success == true and .[0].results[0].count == 10' \
            <<<"$schema_state" >/dev/null

          user_url="https://staybridge-user-staging.${WORKERS_SUBDOMAIN}.workers.dev"
          municipality_url="https://staybridge-municipality-staging.${WORKERS_SUBDOMAIN}.workers.dev"
          user_health="$(curl --fail --silent --show-error --max-time 20 \
            "$user_url/healthz")"
          revision="$(jq -r 'select(.status == "ok" and .service == "user") | .revision' \
            <<<"$user_health")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo "The staged user revision is invalid." >&2
            exit 1
          }
          node scripts/cd/smoke-health.mjs "$user_url" user "$revision"
          node scripts/cd/smoke-health.mjs \
            "$municipality_url" municipality "$revision"
          echo "Staging D1 migrations, seed, schema, and Worker readiness passed."
