name: Dispatch E2E

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Application commit SHA to test (defaults to the current commit)
        required: false
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      vars.E2E_REPOSITORY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      E2E_REPOSITORY: ${{ vars.E2E_REPOSITORY }}
      E2E_DISPATCH_TOKEN: ${{ secrets.E2E_REPOSITORY_DISPATCH_TOKEN }}
      APPLICATION_REF: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
      APPLICATION_REPOSITORY: ${{ github.repository }}
      APPLICATION_URL: ${{ vars.E2E_APPLICATION_URL }}
    steps:
      - name: Dispatch the tested application revision
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$E2E_DISPATCH_TOKEN" ]; then
            echo "E2E_REPOSITORY_DISPATCH_TOKEN is required when E2E_REPOSITORY is configured." >&2
            exit 1
          fi
          payload=$(jq -n \
            --arg event_type "application-updated" \
            --arg repository "$APPLICATION_REPOSITORY" \
            --arg ref "$APPLICATION_REF" \
            --arg url "$APPLICATION_URL" \
            '{event_type: $event_type, client_payload: {repository: $repository, ref: $ref, url: $url}}')
          curl --fail-with-body --request POST \
            --url "https://api.github.com/repos/${E2E_REPOSITORY}/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${E2E_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload"
