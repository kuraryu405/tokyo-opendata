name: Assign PR author and reviewers

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: assign-pr-people-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  assign:
    name: Assign the PR author and contributor reviewers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Do not check out or execute code from the pull request. This workflow
      # runs with write permissions so that fork pull requests are supported.
      - name: Assign the author and request reviews
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const author = pullRequest.user.login;

            const contributors = await github.paginate(
              github.rest.repos.listContributors,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );

            // GitHub allows at most 15 users in one review request.
            const reviewers = contributors
              .filter(({ type, login }) => type === "User" && login !== author)
              .map(({ login }) => login)
              .slice(0, 15);

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              assignees: [author],
            });

            if (reviewers.length === 0) {
              core.info("No other contributors are available to review this pull request.");
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              reviewers,
              team_reviewers: [],
            });

            core.info(`Requested reviews from: ${reviewers.join(", ")}`);
