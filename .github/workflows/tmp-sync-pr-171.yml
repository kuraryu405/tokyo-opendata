name: Temporary sync PR 171
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-135-chat-history-route'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/issue-135-chat-history-route
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -X ours origin/main
          git rm .github/workflows/tmp-sync-pr-171.yml
          git commit --amend --no-edit
          git push origin "HEAD:fix/issue-135-chat-history-route"
