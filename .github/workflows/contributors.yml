name: Recognize contributors

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  add-contributor:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    env:
      RAW_CONTRIBUTOR: ${{ github.event.pull_request.user.login }}
      RAW_SOURCE_PR: ${{ github.event.pull_request.number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check contributor automation token
        id: contributor_token
        shell: bash
        env:
          TOKEN: ${{ secrets.CONTRIBUTOR_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Contributor recognition skipped"
              echo
              echo "CONTRIBUTOR_AUTOMATION_TOKEN is not configured for this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.contributor_token.outputs.configured == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.contributor_token.outputs.configured == 'true'
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.contributor_token.outputs.configured == 'true'
      - name: Validate contributor event inputs
        id: contributor_inputs
        if: steps.contributor_token.outputs.configured == 'true'
        run: >-
          node scripts/contributor-inputs.mjs
          "$RAW_CONTRIBUTOR" "$RAW_SOURCE_PR" >> "$GITHUB_OUTPUT"
      - name: Add the merged PR author to All Contributors
        if: steps.contributor_token.outputs.configured == 'true'
        env:
          CONTRIBUTOR: ${{ steps.contributor_inputs.outputs.contributor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pnpm dlx all-contributors-cli@6.26.1 all-contributors add "$CONTRIBUTOR" code
          pnpm dlx all-contributors-cli@6.26.1 all-contributors generate
      - name: Commit recognition changes
        id: recognition_commit
        if: steps.contributor_token.outputs.configured == 'true'
        env:
          CONTRIBUTOR: ${{ steps.contributor_inputs.outputs.contributor }}
          BRANCH: ${{ steps.contributor_inputs.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .all-contributorsrc README.md
          git commit -m "docs: recognize ${CONTRIBUTOR} as a contributor"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push branch and open a recognition pull request
        if: >-
          steps.contributor_token.outputs.configured == 'true' &&
          steps.recognition_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CONTRIBUTOR_AUTOMATION_TOKEN }}
          CONTRIBUTOR: ${{ steps.contributor_inputs.outputs.contributor }}
          SOURCE_PR: ${{ steps.contributor_inputs.outputs.source_pr }}
          BRANCH: ${{ steps.contributor_inputs.outputs.branch }}
        run: |
          set -euo pipefail
          git \
            -c core.hooksPath=/dev/null \
            -c credential.helper= \
            -c credential.helper='!gh auth git-credential' \
            push --set-upstream origin "$BRANCH"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "docs: recognize ${CONTRIBUTOR} as a contributor" \
            --body "Recognizes @${CONTRIBUTOR} for the merged source PR #${SOURCE_PR}."
