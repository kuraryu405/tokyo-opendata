name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-user:
    name: Deploy user Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: ${{ vars.USER_WORKER_NAME || 'staybridge-user' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.USER_APP_URL }}
      NEXT_PUBLIC_MUNICIPALITY_APP_URL: ${{ vars.MUNICIPALITY_APP_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate user deploy configuration
        working-directory: apps/user
        run: pnpm exec vinext deploy --dry-run --name "$WORKER_NAME"

      - name: Deploy user Worker
        working-directory: apps/user
        run: pnpm exec vinext deploy --name "$WORKER_NAME"

  deploy-municipality:
    name: Deploy municipality Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: ${{ vars.MUNICIPALITY_WORKER_NAME || 'staybridge-municipality' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.MUNICIPALITY_APP_URL }}
      NEXT_PUBLIC_USER_APP_URL: ${{ vars.USER_APP_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate municipality deploy configuration
        working-directory: apps/municipality
        run: pnpm exec vinext deploy --dry-run --name "$WORKER_NAME"

      - name: Deploy municipality Worker
        working-directory: apps/municipality
        run: pnpm exec vinext deploy --name "$WORKER_NAME"
